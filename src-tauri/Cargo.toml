[package]
name = "mp-command-center"
version = "0.1.0"
description = "Цифровой штаб Молодёжного парламента"
authors = ["Youth Parliament"]
edition = "2021"

[lib]
name = "mp_command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
